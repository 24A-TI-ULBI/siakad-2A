<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIAKAD - Sistem Informasi Jadwal & Ruangan</title>
  <!-- Google Fonts -->
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg-color: #f8fafc;
      --surface-color: #ffffff;
      --surface-border: #e2e8f0;
      --primary: #ff6d00;
      --primary-glow: rgba(255, 109, 0, 0.12);
      --secondary: #2e7d32;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --accent: #d05300;
      --accent-glow: rgba(208, 83, 0, 0.1);
      --danger: #d32f2f;
      --card-gradient: linear-gradient(135deg, #ffffff 0%, #f8fafc 100%);
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg-color);
      background-image:
        radial-gradient(at 0% 0%, rgba(255, 109, 0, 0.05) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(255, 145, 0, 0.03) 0px, transparent 50%);
      color: var(--text-main);
      min-height: 100.1vh;
      padding-bottom: 50px;
      overflow-x: hidden;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 20px;
    }

    /* Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--surface-color);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--surface-border);
      padding: 20px 40px;
      border-radius: 24px;
      margin-bottom: 40px;
      box-shadow: 0 8px 32px 0 rgba(148, 163, 184, 0.06);
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .logo-icon {
      background: linear-gradient(135deg, var(--primary), #ff9100);
      width: 48px;
      height: 48px;
      border-radius: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-size: 20px;
      box-shadow: 0 0 20px var(--primary-glow);
    }

    .logo-text h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 20px;
      font-weight: 700;
      background: linear-gradient(to right, var(--text-main), var(--text-muted));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .logo-text p {
      font-size: 11px;
      color: var(--primary);
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .student-info {
      text-align: right;
    }

    .student-info h3 {
      font-size: 14px;
      color: var(--text-main);
      font-weight: 600;
    }

    .student-info p {
      font-size: 12px;
      color: var(--text-muted);
    }

    .student-badge {
      background: rgba(255, 109, 0, 0.1);
      border: 1px solid rgba(255, 109, 0, 0.25);
      color: var(--primary);
      padding: 3px 8px;
      border-radius: 8px;
      font-size: 10px;
      font-weight: 700;
      margin-top: 4px;
      display: inline-block;
    }

    .back-btn {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      border: 1px solid var(--surface-border);
      padding: 8px 16px;
      border-radius: 12px;
      transition: var(--transition);
      background: #ffffff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .back-btn:hover {
      color: var(--primary);
      background: rgba(255, 109, 0, 0.05);
      border-color: var(--primary);
    }

    /* Grid Dashboard */
    .dashboard-grid {
      display: grid;
      grid-template-columns: 3fr 1.3fr;
      gap: 30px;
    }

    @media (max-width: 1100px) {
      .dashboard-grid {
        grid-template-columns: 1fr;
      }
    }

    /* Cards */
    .glass-card {
      background: var(--surface-color);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--surface-border);
      border-radius: 24px;
      padding: 30px;
      box-shadow: 0 10px 30px rgba(148, 163, 184, 0.05);
      transition: var(--transition);
    }

    .glass-card:hover {
      border-color: rgba(255, 109, 0, 0.3);
      box-shadow: 0 15px 35px rgba(255, 109, 0, 0.06);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }

    .card-title {
      font-family: 'Outfit', sans-serif;
      font-size: 22px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .card-title i {
      color: var(--primary);
    }

    /* Actions & Filters */
    .filter-bar {
      display: flex;
      gap: 15px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .filter-select,
    .form-input {
      background: #ffffff;
      border: 1px solid var(--surface-border);
      color: var(--text-main);
      padding: 12px 16px;
      border-radius: 14px;
      font-size: 14px;
      outline: none;
      transition: var(--transition);
    }

    .filter-select:focus,
    .form-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 10px var(--primary-glow);
    }

    /* Buttons */
    .btn {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--primary);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      box-shadow: 0 4px 15px var(--primary-glow);
    }

    .btn:hover {
      transform: translateY(-2px);
      background: #ff5400;
      box-shadow: 0 6px 20px rgba(255, 109, 0, 0.25);
    }

    .btn-secondary {
      background: transparent;
      border: 1px solid var(--surface-border);
      color: var(--text-main);
      box-shadow: none;
    }

    .btn-secondary:hover {
      background: rgba(0, 0, 0, 0.03);
      border-color: var(--text-muted);
      box-shadow: none;
    }

    /* Table */
    .table-responsive {
      width: 100%;
      overflow-x: auto;
      border-radius: 16px;
      border: 1px solid var(--surface-border);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th {
      background: #f8fafc;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 18px 24px;
      border-bottom: 1px solid var(--surface-border);
    }

    td {
      padding: 18px 24px;
      font-size: 14px;
      border-bottom: 1px solid var(--surface-border);
      color: var(--text-main);
      background: #ffffff;
    }

    tr:hover td {
      background: #f8fafc;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
    }

    .badge-success {
      background: rgba(46, 125, 50, 0.1);
      color: var(--secondary);
      border: 1px solid rgba(46, 125, 50, 0.2);
    }

    .badge-danger {
      background: rgba(211, 47, 47, 0.1);
      color: var(--danger);
      border: 1px solid rgba(211, 47, 47, 0.2);
    }

    .badge-info {
      background: rgba(255, 109, 0, 0.1);
      color: var(--primary);
      border: 1px solid rgba(255, 109, 0, 0.2);
    }

    .actions-cell {
      display: flex;
      gap: 10px;
    }

    .icon-btn {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      border: 1px solid var(--surface-border);
      background: #ffffff;
      color: var(--text-muted);
      cursor: pointer;
      transition: var(--transition);
    }

    .icon-btn:hover {
      color: var(--primary);
      background: rgba(255, 109, 0, 0.05);
      border-color: var(--primary);
    }

    .icon-btn.delete:hover {
      color: var(--danger);
      border-color: rgba(211, 47, 47, 0.3);
      background: rgba(211, 47, 47, 0.1);
    }

    /* Room list right sidebar */
    .room-card-list {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .room-mini-card {
      background: #ffffff;
      border: 1px solid var(--surface-border);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: var(--transition);
    }

    .room-mini-card:hover {
      background: rgba(255, 109, 0, 0.02);
      border-color: var(--primary);
      transform: translateX(4px);
    }

    .room-info-left h4 {
      font-size: 15px;
      font-weight: 600;
    }

    .room-info-left p {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* Modal Overlay & Card */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.3);
      backdrop-filter: blur(8px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .modal-card {
      background: #ffffff;
      border: 1px solid var(--surface-border);
      width: 100%;
      max-width: 550px;
      border-radius: 24px;
      padding: 40px;
      position: relative;
      box-shadow: 0 20px 50px rgba(148, 163, 184, 0.15);
      transform: scale(0.9);
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-overlay.active .modal-card {
      transform: scale(1);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }

    .modal-close {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 20px;
      cursor: pointer;
      transition: var(--transition);
    }

    .modal-close:hover {
      color: var(--text-main);
    }

    .form-group {
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .form-group label {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    /* Toast notifications */
    .toast-container {
      position: fixed;
      bottom: 30px;
      right: 30px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .toast {
      background: #ffffff;
      backdrop-filter: blur(10px);
      border: 1px solid var(--surface-border);
      padding: 16px 24px;
      border-radius: 14px;
      color: var(--text-main);
      box-shadow: 0 10px 25px rgba(148, 163, 184, 0.15);
      display: flex;
      align-items: center;
      gap: 12px;
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }

    .toast-success {
      border-left: 4px solid var(--secondary);
    }

    .toast-success i {
      color: var(--secondary);
    }

    .toast-error {
      border-left: 4px solid var(--danger);
    }

    .toast-error i {
      color: var(--danger);
    }
  </style>
</head>

<body>

  <div class="container">

    <header>
      <div class="logo-area">
        <div class="logo-icon">
          <i class="fa-solid fa-calendar-days"></i>
        </div>
        <div class="logo-text">
          <h1>Portal Akademik</h1>
        </div>
      </div>
      <div>
        <a href="/" class="back-btn">
          <i class="fa-solid fa-arrow-left"></i> Kembali ke Dashboard
        </a>
      </div>
    </header>

    <!-- Grid Dashboard -->
    <div class="dashboard-grid">

      <!-- Column 1: Schedule -->
      <div class="glass-card">
        <div class="card-header">
          <h2 class="card-title">
            <i class="fa-solid fa-clock"></i>
            Jadwal Kuliah
          </h2>
          <button class="btn" onclick="openJadwalModal()">
            <i class="fa-solid fa-plus"></i> Tambah Jadwal
          </button>
        </div>

        <!-- Filters -->
        <div class="filter-bar">
          <div style="flex: 1; min-width: 200px;">
            <input type="text" id="filterProdi" class="form-input" placeholder="Cari Program Studi..."
              style="width: 100%;" oninput="applyFilters()">
          </div>
          <div style="flex: 1; min-width: 200px;">
            <input type="text" id="filterDosen" class="form-input" placeholder="Cari Dosen..." style="width: 100%;"
              oninput="applyFilters()">
          </div>
          <button class="btn btn-secondary" onclick="resetFilters()">
            <i class="fa-solid fa-arrows-rotate"></i> Reset
          </button>
        </div>

        <!-- Table Content -->
        <div class="table-responsive">
          <table>
            <thead>
              <tr>
                <th>Mata Kuliah</th>
                <th>Dosen</th>
                <th>Prodi</th>
                <th>Waktu</th>
                <th>Ruangan</th>
                <th>Aksi</th>
              </tr>
            </thead>
            <tbody id="jadwalTableBody">
              <tr>
                <td colspan="6" style="text-align: center; color: var(--text-muted);">
                  <i class="fa-solid fa-spinner fa-spin"></i> Memuat data jadwal kuliah...
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- Column 2: Rooms -->
      <div class="glass-card">
        <div class="card-header">
          <h2 class="card-title">
            <i class="fa-solid fa-door-open"></i>
            Ruangan
          </h2>
          <button class="icon-btn" onclick="openRuanganModal()" title="Tambah Ruangan">
            <i class="fa-solid fa-plus"></i>
          </button>
        </div>

        <div class="room-card-list" id="ruanganList">
          <div style="text-align: center; color: var(--text-muted); padding: 20px 0;">
            <i class="fa-solid fa-spinner fa-spin"></i> Memuat data ruangan...
          </div>
        </div>
      </div>

    </div>

  </div>

  <!-- MODAL JADWAL KULIAH -->
  <div class="modal-overlay" id="jadwalModal">
    <div class="modal-card">
      <div class="modal-header">
        <h3 class="card-title" id="modalJadwalTitle"><i class="fa-solid fa-calendar-plus"></i> Tambah Jadwal
          Kuliah</h3>
        <button class="modal-close" onclick="closeJadwalModal()"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <form id="jadwalForm" onsubmit="saveJadwal(event)">
        <input type="hidden" id="jadwalId">

        <div class="form-group">
          <label for="matkul">Nama Mata Kuliah</label>
          <input type="text" id="matkul" class="form-input" placeholder="Contoh: Pemrograman Mobile" required>
        </div>

        <div class="form-group">
          <label for="dosen">Dosen Pengampu</label>
          <input type="text" id="dosen" class="form-input" placeholder="Contoh: Roni Habibi, S.Kom., M.T." required>
        </div>

        <div class="form-group">
          <label for="prodi">Program Studi</label>
          <input type="text" id="prodi" class="form-input" placeholder="Contoh: D4 Teknik Informatika" required>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="hari">Hari</label>
            <select id="hari" class="filter-select" style="width: 100%;" required>
              <option value="Senin">Senin</option>
              <option value="Selasa">Selasa</option>
              <option value="Rabu">Rabu</option>
              <option value="Kamis">Kamis</option>
              <option value="Jumat">Jumat</option>
              <option value="Sabtu">Sabtu</option>
            </select>
          </div>
          <div class="form-group">
            <label for="ruangan">Ruangan</label>
            <select id="ruangan" class="filter-select" style="width: 100%;" required>
              <!-- Dynamically loaded rooms -->
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="jamMulai">Jam Mulai</label>
            <input type="time" id="jamMulai" class="form-input" required>
          </div>
          <div class="form-group">
            <label for="jamSelesai">Jam Selesai</label>
            <input type="time" id="jamSelesai" class="form-input" required>
          </div>
        </div>

        <div style="display: flex; justify-content: flex-end; gap: 15px; margin-top: 30px;">
          <button type="button" class="btn btn-secondary" onclick="closeJadwalModal()">Batal</button>
          <button type="submit" class="btn">Simpan Jadwal</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL RUANGAN -->
  <div class="modal-overlay" id="ruanganModal">
    <div class="modal-card">
      <div class="modal-header">
        <h3 class="card-title" id="modalRuanganTitle"><i class="fa-solid fa-door-closed"></i> Tambah Ruangan
          Baru</h3>
        <button class="modal-close" onclick="closeRuanganModal()"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <form id="ruanganForm" onsubmit="saveRuangan(event)">
        <input type="hidden" id="ruanganOriginalKode">

        <div class="form-group">
          <label for="namaRuangan">Nama Ruangan</label>
          <input type="text" id="namaRuangan" class="form-input" placeholder="Contoh: Lab Komputer 3" required>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="kodeRuangan">Kode Ruangan</label>
            <input type="text" id="kodeRuangan" class="form-input" placeholder="Contoh: LAB-03" required>
          </div>
          <div class="form-group">
            <label for="kapasitasRuangan">Kapasitas</label>
            <input type="number" id="kapasitasRuangan" class="form-input" placeholder="Contoh: 40" required>
          </div>
        </div>

        <div class="form-group">
          <label for="gedungRuangan">Gedung</label>
          <input type="text" id="gedungRuangan" class="form-input" placeholder="Contoh: Gedung A" required>
        </div>

        <div class="form-group">
          <label for="fasilitasRuangan">Fasilitas (pisahkan dengan koma)</label>
          <input type="text" id="fasilitasRuangan" class="form-input" placeholder="Contoh: AC, Proyektor, Komputer">
        </div>

        <div style="display: flex; justify-content: flex-end; gap: 15px; margin-top: 30px;">
          <button type="button" class="btn btn-secondary" onclick="closeRuanganModal()">Batal</button>
          <button type="submit" class="btn">Simpan Ruangan</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toasts container -->
  <div class="toast-container" id="toastContainer"></div>

  <script>
    const API_BASE = '/api';

    let jadwals = [];
    let ruangans = [];

    // App Initializer
    window.addEventListener('DOMContentLoaded', async () => {
      await fetchRuangans();
      await fetchJadwals();
    });

    // Show toast alerts
    function showToast(message, type = 'success') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = `toast toast-${type}`;

      const icon = type === 'success' ? 'fa-circle-check' : 'fa-circle-exclamation';
      toast.innerHTML = `
                <i class="fa-solid ${icon}"></i>
                <span>${message}</span>
            `;

      container.appendChild(toast);

      // Trigger animation
      setTimeout(() => toast.classList.add('show'), 10);

      // Remove toast after 4s
      setTimeout(() => {
        toast.classList.remove('show');
        setTimeout(() => toast.remove(), 400);
      }, 4000);
    }

    // Fetch Schedules
    async function fetchJadwals() {
      const prodi = document.getElementById('filterProdi').value;
      const dosen = document.getElementById('filterDosen').value;

      const params = new URLSearchParams();
      if (prodi) params.append('prodi', prodi);
      if (dosen) params.append('dosen', dosen);

      try {
        const response = await fetch(`${API_BASE}/jadwal?${params.toString()}`);
        const result = await response.json();

        if (result.status === 'success') {
          jadwals = result.data || [];
          renderJadwals(jadwals);
        } else {
          showToast(result.message || 'Gagal memuat jadwal', 'error');
        }
      } catch (err) {
        console.error(err);
        showToast('Koneksi ke backend bermasalah', 'error');
      }
    }

    // Fetch Rooms
    async function fetchRuangans() {
      try {
        const response = await fetch(`${API_BASE}/ruangan`);
        const result = await response.json();

        if (result.status === 'success') {
          ruangans = result.data || [];
          renderRuangans(ruangans);
          populateRoomDropdown(ruangans);
        } else {
          showToast(result.message || 'Gagal memuat ruangan', 'error');
        }
      } catch (err) {
        console.error(err);
        showToast('Gagal terhubung untuk mengambil data ruangan', 'error');
      }
    }

    // Populate Room Selection Dropdown inside Jadwal form
    function populateRoomDropdown(rooms) {
      const selectEl = document.getElementById('ruangan');
      selectEl.innerHTML = '';

      if (rooms.length === 0) {
        selectEl.innerHTML = '<option value="">Silakan tambah ruangan dahulu</option>';
        return;
      }

      rooms.forEach(r => {
        const option = document.createElement('option');
        option.value = r.kode;
        option.textContent = `${r.nama} (${r.kode})`;
        selectEl.appendChild(option);
      });
    }

    // Render Schedules into table
    function renderJadwals(data) {
      const tbody = document.getElementById('jadwalTableBody');
      tbody.innerHTML = '';

      if (data.length === 0) {
        tbody.innerHTML = `
                    <tr>
                        <td colspan="6" style="text-align: center; color: var(--text-muted); padding: 30px 0;">
                            Tidak ada jadwal kuliah yang tersedia
                        </td>
                    </tr>
                `;
        return;
      }

      data.forEach(j => {
        const roomObj = ruangans.find(r => r.kode === j.ruangan_kode);
        const roomName = roomObj ? roomObj.nama : 'Tanpa Ruangan';
        const roomDetails = roomObj ? `Kapasitas: ${roomObj.kapasitas}` : '';

        const tr = document.createElement('tr');
        tr.innerHTML = `
                    <td style="font-weight: 600;">${j.mata_kuliah}</td>
                    <td>${j.dosen}</td>
                    <td><span class="badge badge-info">${j.prodi}</span></td>
                    <td>
                        <div style="font-weight: 600;">${j.hari}</div>
                        <div style="font-size: 12px; color: var(--text-muted); margin-top: 2px;">
                            ${j.jam_mulai} - ${j.jam_selesai}
                        </div>
                    </td>
                    <td>
                        <div style="font-weight: 600;" title="${roomDetails}">${roomName}</div>
                        <div style="font-size: 11px; color: var(--text-muted);">${j.ruangan_kode || '-'}</div>
                    </td>
                    <td>
                        <div class="actions-cell">
                            <button class="icon-btn" onclick="editJadwal('${j._id}')" title="Edit Jadwal">
                                <i class="fa-solid fa-pen"></i>
                            </button>
                            <button class="icon-btn delete" onclick="deleteJadwal('${j._id}')" title="Hapus Jadwal">
                                <i class="fa-solid fa-trash-can"></i>
                            </button>
                        </div>
                    </td>
                `;
        tbody.appendChild(tr);
      });
    }

    // Render Rooms in right sidebar
    function renderRuangans(data) {
      const list = document.getElementById('ruanganList');
      list.innerHTML = '';

      if (data.length === 0) {
        list.innerHTML = `
                    <div style="text-align: center; color: var(--text-muted); padding: 20px 0;">
                        Tidak ada data ruangan
                    </div>
                `;
        return;
      }

      data.forEach(r => {
        const facilitiesList = r.fasilitas && r.fasilitas.length > 0 ? r.fasilitas.join(', ') : 'Tidak ada fasilitas';

        const div = document.createElement('div');
        div.className = 'room-mini-card';
        div.innerHTML = `
                    <div class="room-info-left" style="flex: 1;">
                        <h4 style="color: var(--text-main); font-weight: 600;">${r.nama} (${r.kode})</h4>
                        <p style="font-size: 12px; color: var(--text-muted); margin-top: 4px;">
                            <i class="fa-solid fa-building"></i> ${r.gedung || 'Tanpa Gedung'} &nbsp;|&nbsp;
                            <i class="fa-solid fa-users"></i> Kapasitas: ${r.kapasitas || 0}
                        </p>
                        <p style="font-size: 11px; color: var(--secondary); margin-top: 4px; line-height: 1.3;">
                            <i class="fa-solid fa-toolbox"></i> ${facilitiesList}
                        </p>
                    </div>
                    <div class="actions-cell" style="margin-left: 10px;">
                        <button class="icon-btn" onclick="editRuangan('${r.kode}')" title="Edit Ruangan" style="width: 28px; height: 28px; font-size: 11px; border-radius: 6px;">
                            <i class="fa-solid fa-pen"></i>
                        </button>
                        <button class="icon-btn delete" onclick="deleteRuangan('${r.kode}')" title="Hapus Ruangan" style="width: 28px; height: 28px; font-size: 11px; border-radius: 6px;">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                    </div>
                `;
        list.appendChild(div);
      });
    }

    // Filter functionality
    let filterTimeout;
    function applyFilters() {
      clearTimeout(filterTimeout);
      filterTimeout = setTimeout(() => {
        fetchJadwals();
      }, 300); // Debounce inputs
    }

    async function resetFilters() {
      document.getElementById('filterProdi').value = '';
      document.getElementById('filterDosen').value = '';
      await fetchJadwals();
    }

    // Modal triggers
    function openJadwalModal() {
      document.getElementById('modalJadwalTitle').innerHTML = '<i class="fa-solid fa-calendar-plus"></i> Tambah Jadwal Kuliah';
      document.getElementById('jadwalId').value = '';
      document.getElementById('jadwalForm').reset();
      document.getElementById('jadwalModal').classList.add('active');
    }

    // Close modal helper
    function closeJadwalModal() {
      document.getElementById('jadwalModal').classList.remove('active');
    }

    function openRuanganModal() {
      document.getElementById('modalRuanganTitle').innerHTML = '<i class="fa-solid fa-door-closed"></i> Tambah Ruangan Baru';
      document.getElementById('ruanganOriginalKode').value = '';
      document.getElementById('ruanganForm').reset();
      document.getElementById('kodeRuangan').disabled = false;
      document.getElementById('ruanganModal').classList.add('active');
    }

    function closeRuanganModal() {
      document.getElementById('ruanganModal').classList.remove('active');
    }

    // CRUD: Create/Update Schedules
    async function saveJadwal(e) {
      e.preventDefault();

      const id = document.getElementById('jadwalId').value;
      const matkul = document.getElementById('matkul').value;
      const dosen = document.getElementById('dosen').value;
      const prodi = document.getElementById('prodi').value;
      const hari = document.getElementById('hari').value;
      const roomKode = document.getElementById('ruangan').value;
      const jamMulai = document.getElementById('jamMulai').value;
      const jamSelesai = document.getElementById('jamSelesai').value;

      const payload = {
        mata_kuliah: matkul,
        dosen: dosen,
        prodi: prodi,
        hari: hari,
        jam_mulai: jamMulai,
        jam_selesai: jamSelesai,
        ruangan_kode: roomKode
      };

      const method = id ? 'PUT' : 'POST';
      const url = id ? `${API_BASE}/jadwal/${id}` : `${API_BASE}/jadwal`;

      try {
        const response = await fetch(url, {
          method: method,
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const result = await response.json();

        if (result.status === 'success') {
          showToast(id ? 'Jadwal berhasil diperbarui' : 'Jadwal berhasil ditambahkan', 'success');
          closeJadwalModal();
          fetchJadwals();
        } else {
          showToast(result.message || 'Gagal menyimpan jadwal', 'error');
        }
      } catch (err) {
        console.error(err);
        showToast('Gagal menyimpan jadwal, masalah server', 'error');
      }
    }

    // CRUD: Edit Jadwal Mode
    function editJadwal(id) {
      const j = jadwals.find(item => item._id === id);
      if (!j) return;

      document.getElementById('modalJadwalTitle').innerHTML = '<i class="fa-solid fa-calendar-check"></i> Edit Jadwal Kuliah';
      document.getElementById('jadwalId').value = j._id;
      document.getElementById('matkul').value = j.mata_kuliah;
      document.getElementById('dosen').value = j.dosen;
      document.getElementById('prodi').value = j.prodi;
      document.getElementById('hari').value = j.hari;
      document.getElementById('ruangan').value = j.ruangan_kode || '';
      document.getElementById('jamMulai').value = j.jam_mulai;
      document.getElementById('jamSelesai').value = j.jam_selesai;

      document.getElementById('jadwalModal').classList.add('active');
    }

    // CRUD: Delete Schedule
    async function deleteJadwal(id) {
      if (!confirm('Apakah Anda yakin ingin menghapus jadwal ini?')) return;

      try {
        const response = await fetch(`${API_BASE}/jadwal/${id}`, { method: 'DELETE' });
        const result = await response.json();

        if (result.status === 'success') {
          showToast('Jadwal berhasil dihapus', 'success');
          fetchJadwals();
        } else {
          showToast(result.message || 'Gagal menghapus jadwal', 'error');
        }
      } catch (err) {
        console.error(err);
        showToast('Gagal menghapus jadwal, koneksi terputus', 'error');
      }
    }

    // CRUD: Create/Update Room
    async function saveRuangan(e) {
      e.preventDefault();

      const originalKode = document.getElementById('ruanganOriginalKode').value;
      const nama = document.getElementById('namaRuangan').value;
      const kode = document.getElementById('kodeRuangan').value;
      const kapasitas = parseInt(document.getElementById('kapasitasRuangan').value);
      const gedung = document.getElementById('gedungRuangan').value;
      const fasilitasRaw = document.getElementById('fasilitasRuangan').value;

      const fasilitas = fasilitasRaw
        ? fasilitasRaw.split(',').map(f => f.trim()).filter(f => f.length > 0)
        : [];

      const payload = {
        nama: nama,
        kode: kode,
        kapasitas: kapasitas,
        gedung: gedung,
        fasilitas: fasilitas
      };

      const isEdit = originalKode !== '';
      const method = isEdit ? 'PUT' : 'POST';
      const url = isEdit ? `${API_BASE}/ruangan/${originalKode}` : `${API_BASE}/ruangan`;

      try {
        const response = await fetch(url, {
          method: method,
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const result = await response.json();

        if (result.status === 'success') {
          showToast(isEdit ? 'Ruangan berhasil diperbarui' : 'Ruangan berhasil ditambahkan', 'success');
          closeRuanganModal();
          await fetchRuangans();
          await fetchJadwals(); // Reload schedules in case room names changed
        } else {
          showToast(result.message || 'Gagal menyimpan ruangan', 'error');
        }
      } catch (err) {
        console.error(err);
        showToast('Gagal menyimpan ruangan, koneksi terputus', 'error');
      }
    }

    // CRUD: Edit Ruangan Mode
    function editRuangan(kode) {
      const r = ruangans.find(item => item.kode === kode);
      if (!r) return;

      document.getElementById('modalRuanganTitle').innerHTML = '<i class="fa-solid fa-door-open"></i> Edit Ruangan';
      document.getElementById('ruanganOriginalKode').value = r.kode;
      document.getElementById('namaRuangan').value = r.nama || '';
      document.getElementById('kodeRuangan').value = r.kode || '';
      document.getElementById('kapasitasRuangan').value = r.kapasitas || '';
      document.getElementById('gedungRuangan').value = r.gedung || '';
      document.getElementById('fasilitasRuangan').value = r.fasilitas ? r.fasilitas.join(', ') : '';

      document.getElementById('kodeRuangan').disabled = true;
      document.getElementById('ruanganModal').classList.add('active');
    }

    // CRUD: Delete Room
    async function deleteRuangan(kode) {
      if (!confirm(`Apakah Anda yakin ingin menghapus ruangan dengan kode ${kode}?`)) return;

      try {
        const response = await fetch(`${API_BASE}/ruangan/${kode}`, { method: 'DELETE' });
        const result = await response.json();

        if (result.status === 'success') {
          showToast('Ruangan berhasil dihapus', 'success');
          await fetchRuangans();
          await fetchJadwals();
        } else {
          showToast(result.message || 'Gagal menghapus ruangan', 'error');
        }
      } catch (err) {
        console.error(err);
        showToast('Gagal menghapus ruangan, koneksi terputus', 'error');
      }
    }
  </script>
</body>

</html>

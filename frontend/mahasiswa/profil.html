<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profil — SIAKAD</title>
  <link rel="stylesheet" href="../shared/style.css">
  <style>
    .profile-hero {
      background: linear-gradient(135deg, var(--primary) 0%, #f59e0b 100%);
      color: white;
      border-radius: 16px;
      padding: 28px;
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 16px;
      position: relative;
      overflow: hidden;
    }
    .profile-hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: url('https://www.transparenttextures.com/patterns/topography.png');
      opacity: 0.08;
      pointer-events: none;
    }
    .profile-hero-content { position: relative; z-index: 1; flex: 1; }
    .profile-hero-eyebrow { font-size: 10px; text-transform: uppercase; letter-spacing: 0.4em; color: rgba(255,255,255,0.75); font-weight: 600; margin-bottom: 4px; }
    .profile-hero-name { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
    .profile-hero-prodi { font-size: 13px; color: rgba(255,255,255,0.85); }
    .profile-hero-badge {
      background: rgba(255,255,255,0.2);
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 20px;
      padding: 4px 12px;
      font-size: 12px;
      font-weight: 600;
      color: white;
      white-space: nowrap;
    }
    .profile-avatar-lg {
      width: 64px; height: 64px;
      border-radius: 16px;
      background: rgba(255,255,255,0.2);
      border: 2px solid rgba(255,255,255,0.3);
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; font-weight: 700; color: white;
      flex-shrink: 0;
      position: relative; z-index: 1;
    }
  </style>
</head>
<body>

<header class="siakad-header">
  <div class="siakad-header-left">
    <a href="../index.html" class="siakad-header-logo" style="display:flex;align-items:center;gap:10px;text-decoration:none;">
      <img src="https://raw.githubusercontent.com/saripudin14/img/refs/heads/main/logo.png"
           alt="Logo" style="width:28px;height:28px;border-radius:7px;object-fit:contain;background:rgba(255,255,255,0.2);padding:3px;">
      <span style="color:white;font-weight:700;font-size:15px;">SIAKAD</span>
    </a>
    <div class="siakad-header-divider"></div>
    <span class="siakad-header-module">Modul Mahasiswa</span>
  </div>
  <div class="siakad-header-right">
    <button onclick="logout()" class="btn btn-secondary btn-sm">Logout</button>
  </div>
</header>

<nav class="siakad-nav">
  <a href="daftar.html">Daftar</a>
  <a href="tambah.html">Tambah</a>
  <a href="login.html">Login</a>
  <a href="profil.html" class="active">Profil</a>
</nav>

<div class="siakad-container-sm" style="padding-top:32px;">

  <!-- Loading -->
  <div id="loading-state" class="card">
    <div class="card-body" style="display:flex;align-items:center;gap:12px;padding:32px;">
      <div style="width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin 0.6s linear infinite;"></div>
      <span style="font-size:13px;color:var(--text-secondary);">Memuat profil...</span>
    </div>
  </div>

  <!-- Error -->
  <div id="error-state" style="display:none;">
    <div class="alert alert-error" style="display:flex;align-items:center;justify-content:space-between;">
      <span id="error-msg">Gagal memuat profil.</span>
      <a href="login.html" style="color:inherit;font-weight:600;margin-left:12px;white-space:nowrap;">Login ulang</a>
    </div>
  </div>

  <!-- Profile -->
  <div id="profile-card" style="display:none;">

    <!-- Hero -->
    <div class="profile-hero">
      <div class="profile-avatar-lg" id="profile-avatar">?</div>
      <div class="profile-hero-content">
        <div class="profile-hero-eyebrow">Mahasiswa</div>
        <div class="profile-hero-name" id="profile-nama">-</div>
        <div class="profile-hero-prodi" id="profile-prodi">-</div>
      </div>
      <span class="profile-hero-badge" id="profile-angkatan">-</span>
    </div>

    <!-- Data -->
    <div class="card" style="margin-bottom:16px;">
      <div class="card-header">
        <span class="card-title">Informasi Akademik</span>
      </div>
      <div class="card-body">
        <div class="profile-grid">
          <div class="profile-field">
            <label>NPM</label>
            <span id="profile-npm" style="font-family:monospace;">-</span>
          </div>
          <div class="profile-field">
            <label>No. HP</label>
            <span id="profile-phone">-</span>
          </div>
          <div class="profile-field" style="grid-column:1/-1;">
            <label>Email</label>
            <span id="profile-email">-</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Token -->
    <div class="card" style="margin-bottom:16px;">
      <div class="card-header">
        <span class="card-title">Token Aktif</span>
        <button class="btn btn-ghost btn-sm" onclick="toggleToken()" id="btn-toggle">Tampilkan</button>
      </div>
      <div id="token-area" style="display:none;">
        <div style="padding:16px 20px;">
          <div class="token-box" id="token-display"></div>
          <button class="btn btn-secondary btn-sm" style="margin-top:10px;" onclick="copyToken()">Salin Token</button>
        </div>
      </div>
    </div>

    <!-- Actions -->
    <div style="display:flex;gap:10px;">
      <a href="daftar.html" class="btn btn-secondary" style="flex:1;justify-content:center;">Lihat Daftar Mahasiswa</a>
      <button onclick="logout()" class="btn btn-danger">Logout</button>
    </div>
  </div>
</div>

<script src="../shared/utils.js"></script>
<script>
  if (!Auth.isLoggedIn()) window.location.href = 'login.html';

  async function loadProfile() {
    try {
      const data = await apiFetch('/auth/me');
      document.getElementById('loading-state').style.display = 'none';
      document.getElementById('profile-card').style.display  = 'block';

      const initials = getInitials(data.nama);
      document.getElementById('profile-avatar').textContent   = initials;
      document.getElementById('profile-nama').textContent     = data.nama || '-';
      document.getElementById('profile-prodi').textContent    = data.prodi || 'Program Studi belum diisi';
      document.getElementById('profile-angkatan').textContent = data.angkatan ? 'Angkatan ' + data.angkatan : '-';
      document.getElementById('profile-npm').textContent      = data.npm || '-';
      document.getElementById('profile-phone').textContent    = data.phone || '-';
      document.getElementById('profile-email').textContent    = data.email || '-';
      document.getElementById('token-display').textContent    = Auth.getToken();

      Auth.setUser({ npm: data.npm, nama: data.nama, phone: data.phone, prodi: data.prodi });
    } catch (err) {
      document.getElementById('loading-state').style.display = 'none';
      document.getElementById('error-state').style.display   = 'block';
      document.getElementById('error-msg').textContent       = err.message;
    }
  }

  function toggleToken() {
    const area = document.getElementById('token-area');
    const btn  = document.getElementById('btn-toggle');
    const show = area.style.display === 'none';
    area.style.display = show ? 'block' : 'none';
    btn.textContent    = show ? 'Sembunyikan' : 'Tampilkan';
  }

  function copyToken() {
    navigator.clipboard.writeText(Auth.getToken())
      .then(() => showToast('Token berhasil disalin'))
      .catch(() => showToast('Gagal menyalin token', 'error'));
  }

  function logout() {
    Auth.logout();
    showToast('Berhasil logout', 'info');
    setTimeout(() => { window.location.href = 'login.html'; }, 800);
  }

  initNav();
  loadProfile();
</script>
</body>
</html>

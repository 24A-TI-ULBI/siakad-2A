<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar Mahasiswa — SIAKAD</title>
  <link rel="stylesheet" href="../shared/style.css">
</head>
<body>

<header class="siakad-header">
  <div class="siakad-header-left">
    <a href="../index.html" class="siakad-header-logo" style="display:flex;align-items:center;gap:10px;text-decoration:none;">
      <img src="https://raw.githubusercontent.com/saripudin14/img/refs/heads/main/logo.png"
           alt="Logo" style="width:28px;height:28px;border-radius:7px;object-fit:contain;background:rgba(255,255,255,0.2);padding:3px;">
      <span style="color:white;font-weight:700;font-size:15px;">SIAKAD</span>
    </a>
    <div class="siakad-header-divider"></div>
    <span class="siakad-header-module">Modul Mahasiswa</span>
  </div>
  <div class="siakad-header-right">
    <div class="siakad-header-user">
      <span id="header-username"></span>
      <a id="header-avatar" class="siakad-header-avatar" href="login.html">?</a>
    </div>
  </div>
</header>

<nav class="siakad-nav">
  <a href="daftar.html" class="active">Daftar</a>
  <a href="tambah.html">Tambah</a>
  <a href="login.html">Login</a>
  <a href="profil.html">Profil</a>
</nav>

<div class="siakad-container">

  <div class="toolbar" style="margin-bottom:16px;">
    <div class="search-bar">
      <svg class="search-bar-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" id="search-input" placeholder="Cari nama atau NPM..." oninput="filterTable()">
    </div>
    <select class="form-select" id="filter-prodi" onchange="filterTable()" style="width:auto;">
      <option value="">Semua Prodi</option>
    </select>
    <select class="form-select" id="filter-angkatan" onchange="filterTable()" style="width:auto;">
      <option value="">Semua Angkatan</option>
    </select>
    <div class="toolbar-right">
      <a href="tambah.html" class="btn btn-primary">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
        Tambah
      </a>
    </div>
  </div>

  <div class="info-bar" id="info-bar"></div>

  <div class="card" style="margin-top:8px;">
    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>NPM</th>
            <th>Nama</th>
            <th>Email</th>
            <th>No. HP</th>
            <th>Prodi</th>
            <th style="text-align:center;">Angkatan</th>
            <th style="text-align:center;">Aksi</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- Modal Edit -->
<div class="modal-overlay" id="modal-edit">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">Edit Data Mahasiswa</span>
      <button class="modal-close" onclick="closeModal('modal-edit')">&times;</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="edit-npm-original">
      <div class="form-grid">
        <div class="form-group">
          <label class="form-label">NPM</label>
          <input class="form-input" id="edit-npm" disabled style="background:#fafafa;color:var(--text-muted);">
        </div>
        <div class="form-group">
          <label class="form-label">Nama <span class="required">*</span></label>
          <input class="form-input" id="edit-nama" placeholder="Nama lengkap">
        </div>
        <div class="form-group">
          <label class="form-label">Email</label>
          <input class="form-input" id="edit-email" type="email" placeholder="email@contoh.com">
        </div>
        <div class="form-group">
          <label class="form-label">No. HP <span class="required">*</span></label>
          <input class="form-input" id="edit-phone" placeholder="08xxxxxxxxxx">
        </div>
        <div class="form-group">
          <label class="form-label">Program Studi</label>
          <input class="form-input" id="edit-prodi" placeholder="Teknik Informatika">
        </div>
        <div class="form-group">
          <label class="form-label">Angkatan</label>
          <input class="form-input" id="edit-angkatan" type="number" placeholder="2024">
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal('modal-edit')">Batal</button>
      <button class="btn btn-primary" id="btn-save-edit" onclick="saveEdit()">Simpan</button>
    </div>
  </div>
</div>

<!-- Modal Hapus -->
<div class="modal-overlay" id="modal-hapus">
  <div class="modal" style="max-width:400px;">
    <div class="modal-header">
      <span class="modal-title">Konfirmasi Hapus</span>
      <button class="modal-close" onclick="closeModal('modal-hapus')">&times;</button>
    </div>
    <div class="modal-body">
      <p style="font-size:13px;color:var(--text-secondary);line-height:1.6;">
        Hapus data mahasiswa <strong id="hapus-nama" style="color:var(--text-primary);"></strong>
        (NPM: <strong id="hapus-npm" style="color:var(--text-primary);"></strong>)?
        Tindakan ini tidak dapat dibatalkan.
      </p>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal('modal-hapus')">Batal</button>
      <button class="btn btn-danger" id="btn-confirm-hapus" onclick="confirmHapus()">Hapus</button>
    </div>
  </div>
</div>

<script src="../shared/utils.js"></script>
<script>
  let allData = [];
  let hapusNpm = null;

  // Init header user
  initHeaderUser();
  initNav();

  function skeletonRows(rows, cols) {
    const widths = ['55%','75%','65%','50%','60%','35%','70px'];
    return Array.from({length: rows}, () =>
      `<tr>${Array.from({length: cols}, (_,i) =>
        `<td><span class="skeleton" style="display:inline-block;height:12px;width:${widths[i]||'60%'};border-radius:4px;"></span></td>`
      ).join('')}</tr>`
    ).join('');
  }

  async function loadData() {
    const tbody = document.getElementById('tbody');
    tbody.innerHTML = skeletonRows(6, 7);
    document.getElementById('info-bar').textContent = '';
    try {
      allData = await apiFetch('/mahasiswa');
      populateFilters(allData);
      renderTable(allData);
    } catch (e) {
      tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;padding:32px;color:var(--danger);font-size:13px;">Gagal memuat data: ${e.message}</td></tr>`;
    }
  }

  function populateFilters(data) {
    const prodis    = [...new Set(data.map(m => m.prodi).filter(Boolean))].sort();
    const angkatans = [...new Set(data.map(m => m.angkatan).filter(Boolean))].sort((a,b) => b-a);
    const ps = document.getElementById('filter-prodi');
    const as = document.getElementById('filter-angkatan');
    const cp = ps.value, ca = as.value;
    ps.innerHTML = '<option value="">Semua Prodi</option>' + prodis.map(p => `<option value="${p}" ${p===cp?'selected':''}>${p}</option>`).join('');
    as.innerHTML = '<option value="">Semua Angkatan</option>' + angkatans.map(a => `<option value="${a}" ${String(a)===ca?'selected':''}>${a}</option>`).join('');
  }

  function filterTable() {
    const q = document.getElementById('search-input').value.toLowerCase();
    const prodi = document.getElementById('filter-prodi').value;
    const angkatan = document.getElementById('filter-angkatan').value;
    const filtered = allData.filter(m =>
      (!q || m.nama.toLowerCase().includes(q) || m.npm.toLowerCase().includes(q)) &&
      (!prodi || m.prodi === prodi) &&
      (!angkatan || String(m.angkatan) === angkatan)
    );
    renderTable(filtered);
  }

  function renderTable(data) {
    const tbody = document.getElementById('tbody');
    document.getElementById('info-bar').innerHTML =
      `Menampilkan <strong>${data.length}</strong> dari <strong>${allData.length}</strong> mahasiswa`;

    if (!data.length) {
      tbody.innerHTML = `
        <tr><td colspan="7">
          <div class="empty-state">
            <div class="empty-state-icon">&#128100;</div>
            <div class="empty-state-title">Tidak ada data</div>
            <div class="empty-state-desc">Coba ubah filter atau <a href="tambah.html" style="color:var(--primary);font-weight:600;">tambah mahasiswa baru</a></div>
          </div>
        </td></tr>`;
      return;
    }

    tbody.innerHTML = data.map(m => `
      <tr>
        <td><span style="font-family:monospace;font-size:12px;color:var(--text-secondary);">${m.npm}</span></td>
        <td><strong style="font-weight:600;">${m.nama}</strong></td>
        <td class="td-muted">${m.email || '-'}</td>
        <td class="td-muted">${m.phone || '-'}</td>
        <td>${m.prodi ? `<span class="badge badge-primary">${m.prodi}</span>` : '<span class="td-muted">-</span>'}</td>
        <td style="text-align:center;" class="td-muted">${m.angkatan || '-'}</td>
        <td>
          <div class="td-actions" style="justify-content:center;">
            <button class="btn btn-secondary btn-sm" onclick='openEdit(${JSON.stringify(m).replace(/"/g,"&quot;")})'>Edit</button>
            <button class="btn btn-danger btn-sm" onclick="openHapus('${m.npm}','${m.nama.replace(/'/g,"&#39;")}')">Hapus</button>
          </div>
        </td>
      </tr>`).join('');
  }

  function openEdit(m) {
    document.getElementById('edit-npm-original').value = m.npm;
    document.getElementById('edit-npm').value      = m.npm;
    document.getElementById('edit-nama').value     = m.nama || '';
    document.getElementById('edit-email').value    = m.email || '';
    document.getElementById('edit-phone').value    = m.phone || '';
    document.getElementById('edit-prodi').value    = m.prodi || '';
    document.getElementById('edit-angkatan').value = m.angkatan || '';
    openModal('modal-edit');
  }

  async function saveEdit() {
    const npm = document.getElementById('edit-npm-original').value;
    const btn = document.getElementById('btn-save-edit');
    const body = {
      nama:     document.getElementById('edit-nama').value.trim(),
      email:    document.getElementById('edit-email').value.trim(),
      phone:    document.getElementById('edit-phone').value.trim(),
      prodi:    document.getElementById('edit-prodi').value.trim(),
      angkatan: parseInt(document.getElementById('edit-angkatan').value) || 0,
    };
    if (!body.nama || !body.phone) { showToast('Nama dan No. HP wajib diisi', 'error'); return; }
    btn.disabled = true;
    btn.innerHTML = '<span class="btn-spinner"></span> Menyimpan...';
    try {
      await apiFetch('/mahasiswa/' + npm, { method: 'PUT', body: JSON.stringify(body) });
      closeModal('modal-edit');
      showToast('Data berhasil diperbarui');
      loadData();
    } catch (e) { showToast(e.message, 'error'); }
    finally { btn.disabled = false; btn.textContent = 'Simpan'; }
  }

  function openHapus(npm, nama) {
    hapusNpm = npm;
    document.getElementById('hapus-npm').textContent  = npm;
    document.getElementById('hapus-nama').textContent = nama;
    openModal('modal-hapus');
  }

  async function confirmHapus() {
    if (!hapusNpm) return;
    const btn = document.getElementById('btn-confirm-hapus');
    btn.disabled = true;
    btn.innerHTML = '<span class="btn-spinner"></span>';
    try {
      await apiFetch('/mahasiswa/' + hapusNpm, { method: 'DELETE' });
      closeModal('modal-hapus');
      showToast('Data berhasil dihapus');
      loadData();
    } catch (e) { showToast(e.message, 'error'); }
    finally { btn.disabled = false; btn.textContent = 'Hapus'; hapusNpm = null; }
  }

  loadData();
</script>
</body>
</html>
